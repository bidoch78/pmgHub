<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pmgHub</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="hub-brand">
            <h1>pmgHub</h1>
            <span id="connectionStatus" class="hub-connection-status offline">Connecting...</span>
        </div>
        <button id="logoutButton">Log out</button>
    </header>

    <main>
        <section class="dashboard-section" aria-labelledby="sensorsHeading">
            <div class="section-heading">
                <div>
                    <h2 id="sensorsHeading">Sensors</h2>
                    <p>Live readings from your pmgHub</p>
                </div>
            </div>

            <div id="sensorGroups" class="sensor-groups" aria-live="polite"></div>
        </section>

        <section class="devices-section" aria-labelledby="devicesHeading">
            <div class="section-heading">
                <div>
                    <h2 id="devicesHeading">Registered devices</h2>
                    <p>pmgDevices paired with this hub</p>
                </div>
                <span id="deviceCount" class="device-count">Loading devices...</span>
            </div>

            <div id="deviceList" class="device-list" aria-live="polite"></div>
        </section>

        <section class="devices-section" aria-labelledby="pairingHeading">
            <div class="section-heading">
                <div>
                    <h2 id="pairingHeading">Pairing requests</h2>
                    <p>New pmgDevices waiting for approval</p>
                </div>
                <span id="pairingCount" class="device-count">Checking requests...</span>
            </div>
            <div id="pairingList" class="device-list" aria-live="polite"></div>
        </section>
    </main>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
