services:
  pmghub-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pmghub-simulator
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app/web
      - ./simulator:/app/simulator
      - ./data:/app/data
      - /app/simulator/node_modules
    restart: unless-stopped

  pmgdevice-simulator:
    build:
      context: ./web-device
      dockerfile: Dockerfile
    container_name: pmgdevice-simulator
    volumes:
      - ./web-device/web:/usr/share/nginx/html/
    ports:
      - "3001:80"
    restart: unless-stopped