<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pmgHub - Password</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
    <main class="login-box">
        <h1>pmgHub</h1>
        <h2>Enter password</h2>

        <form id="loginForm">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Unlock pmgHub</button>
            <p id="loginError" class="error"></p>
        </form>
    </main>

    <dialog id="initializationDialog">
        <form id="initializationForm">
            <h2>Set hub password</h2>

            <label for="initializationPassword">Password</label>
            <input id="initializationPassword" type="password" autocomplete="new-password" required>

            <label for="initializationConfirmation">Confirm password</label>
            <input id="initializationConfirmation" type="password" autocomplete="new-password" required>

            <button type="submit">Set password</button>
            <p id="initializationError" class="error"></p>
        </form>
    </dialog>

    <script type="module" src="/js/login.js"></script>
</body>
</html>
